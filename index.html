<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the page paint into iOS notch/home-bar areas
         so `env(safe-area-inset-*)` resolves to real device insets instead
         of 0. The CSS that reads those insets (.bottom-nav, .app-main) keeps
         the content clear of the home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Installable to the home screen: the guards' gate screen, and on iPhone the only way
         an approver can receive the phone alert for a credit release (iOS 16.4+).
         use-credentials: a browser fetches the manifest WITHOUT cookies otherwise, and on a
         Vercel preview (login wall on) that returns Vercel's sign-in page → "cannot be installed". -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="apple-mobile-web-app-title" content="Paras" />
    <title>Paras Trucks — Team Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
