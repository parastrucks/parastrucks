# Phase 9g T9 — CI security gates.
#
# Runs on every push and pull request. Three independent jobs:
#   - npm-audit:  fails the build on high/critical advisories.
#   - gitleaks:   secret scan over the full history of the PR.
#   - trivy-fs:   filesystem scan of the lockfile + checked-in files.
#
# All three are jobs that should be fast (<3 min on hosted runners) and
# fail-loud. None of them touch the database or deploy anything.

name: security

on:
  push:
    branches: [main, portal]
  pull_request:
    branches: [main, portal]

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Audit (high/critical only)
        run: npm audit --audit-level=high

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          format: table
