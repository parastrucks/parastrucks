# Phase 9g T3 — GitHub CodeQL (free for public + private repos).
#
# Runs on push, on PR, and weekly. Analyses JavaScript/TypeScript across the
# whole tree (src/, supabase/functions/, vite.config.js).

name: codeql

on:
  push:
    branches: [main, portal]
  pull_request:
    branches: [main, portal]
  schedule:
    # Weekly Monday 03:30 UTC — quiet time, off the morning push wave.
    - cron: '30 3 * * 1'

jobs:
  analyze:
    name: CodeQL JS/TS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
